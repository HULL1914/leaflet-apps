<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tracking Me (with a map)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* status bar floating over the top of the map */
        #status-bar {
            position: absolute;
            top: 10px;
            left: 50px;
            right: 60px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
            font-size: 14px;
        }

        #log {
            flex: 1;
        }

        #stop-button {
            padding: 6px 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <div id="status-bar">
        <div id="log">Waiting for your location... (allow location access when asked)</div>
        <button id="stop-button">Stop tracking</button>
    </div>

    <script src="geoloc-map-script.js"></script>
</body>
</html>
